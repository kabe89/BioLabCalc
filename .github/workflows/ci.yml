name: CI

on:
  push:
    branches: [ "main", "nightly" ]
  pull_request:
    branches: [ "main", "nightly" ]

permissions:
  contents: read

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }} on ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.continue-on-error || false }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Python 3.8 and 3.9 require ubuntu-22.04 (Ubuntu 24.04+ dropped prebuilt EOL 3.8/3.9 toolcache binaries)
          - os: ubuntu-22.04
            python-version: "3.8"
          - os: ubuntu-22.04
            python-version: "3.9"
          - os: ubuntu-latest
            python-version: "3.10"
          - os: ubuntu-latest
            python-version: "3.11"
          - os: ubuntu-latest
            python-version: "3.12"
          - os: ubuntu-latest
            python-version: "3.13"
          - os: ubuntu-latest
            python-version: "3.14"
            continue-on-error: true
          - os: ubuntu-latest
            python-version: "3.15"
            continue-on-error: true
          - os: ubuntu-latest
            python-version: "3.14t"
            continue-on-error: true
          - os: ubuntu-latest
            python-version: "3.15t"
            continue-on-error: true
          # Windows matrix
          - os: windows-latest
            python-version: "3.8"
          - os: windows-latest
            python-version: "3.9"
          - os: windows-latest
            python-version: "3.10"
          - os: windows-latest
            python-version: "3.11"
          - os: windows-latest
            python-version: "3.12"
          - os: windows-latest
            python-version: "3.13"
          - os: windows-latest
            python-version: "3.14"
            continue-on-error: true
          - os: windows-latest
            python-version: "3.15"
            continue-on-error: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run Git Security & PII Audit
        run: |
          python scripts/security_audit.py

      - name: Run CI Guardrails & Architecture Check
        run: |
          python scripts/ci_guard.py

      - name: Verify Documentation Synchronization
        run: |
          python scripts/update_ai_docs.py --check
          python scripts/update_readme.py --check
          python scripts/update_wiki.py --check

      - name: Run unit test suite
        run: |
          python -m unittest discover tests
        env:
          PYTHONPATH: src
