name: Sync Wiki to GitHub Wiki

on:
  push:
    branches: [ "main" ]
    paths:
      - "wiki/**"
      - ".github/workflows/wiki-sync.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-wiki:
    name: Sync Wiki Documentation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify wiki integrity
        run: python scripts/verify_wiki.py

      - name: Deploy to GitHub Wiki
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          # Clone the GitHub Wiki repository
          git clone "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.wiki.git" wiki_repo

          # Replace wiki content with updated files from the repository
          # Note: wiki_repo/* does not delete hidden files like .git
          rm -rf wiki_repo/*
          cp -r wiki/* wiki_repo/

          cd wiki_repo
          git add -A
          if git diff --staged --quiet; then
            echo "Wiki is already up to date. Nothing to commit."
          else
            git commit -m "docs(wiki): synchronize wiki documentation from main [skip ci]"
            git push origin master
          fi
