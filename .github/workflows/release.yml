name: Release & Publish to PyPI

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  build-and-verify:
    name: Build Distribution & Verify Isolated Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build and packaging dependencies
        run: |
          python -m pip install --upgrade pip build twine wheel

      - name: Build sdist and wheel
        run: |
          python -m build

      - name: Check package metadata with twine
        run: |
          python -m twine check dist/*

      - name: Verify sdist unpacked test execution
        run: |
          python -c "
          import glob, os, subprocess, sys, tarfile, tempfile
          sdist = sorted(glob.glob('dist/biolabcalc-*.tar.gz'))[-1]
          with tempfile.TemporaryDirectory() as tmp:
              with tarfile.open(sdist, 'r:gz') as tar:
                  tar.extractall(tmp)
              unpacked = glob.glob(f'{tmp}/biolabcalc-*')[0]
              res = subprocess.run(
                  [sys.executable, '-m', 'unittest', 'discover', '-s', 'tests'],
                  cwd=unpacked,
                  env={**os.environ, 'PYTHONPATH': 'src'}
              )
              assert res.returncode == 0, 'sdist isolated test run failed!'
          print('SDIST ISOLATED VERIFICATION PASSED!')
          "

      - name: Upload dist artifacts
        uses: actions/upload-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

  publish-pypi:
    name: Publish to PyPI via OIDC
    needs: build-and-verify
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/biolabcalc
    permissions:
      id-token: write
    steps:
      - name: Download dist artifacts
        uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true

  github-release:
    name: Create GitHub Release
    needs: [build-and-verify, publish-pypi]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download dist artifacts
        uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

      - name: Determine Prerelease Status
        id: check-prerelease
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          if echo "$TAG" | grep -Eq '([0-9]+(\.[0-9]+)*(a|b|rc|dev)[0-9]*)'; then
            echo "is_prerelease=true" >> "$GITHUB_OUTPUT"
            echo "Detected PEP 440 prerelease tag: $TAG"
          else
            echo "is_prerelease=false" >> "$GITHUB_OUTPUT"
            echo "Detected standard stable release tag: $TAG"
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          prerelease: ${{ steps.check-prerelease.outputs.is_prerelease == 'true' }}
          generate_release_notes: true
