[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "biolabcalc"
version = "1.5.0a1"
description = "A multifaceted Python library and Excel extension for daily molecular biology research, PCR stoichiometry, IVT yields, protein quantification, and primer design."
readme = "README.md"
requires-python = ">=3.8"
license = { file = "LICENSE" }
authors = [
    { name = "BioLabCalc Contributors" }
]
keywords = [
    "bioinformatics",
    "molecular-biology",
    "pcr",
    "transcription",
    "in-vitro-transcription",
    "primer-design",
    "protein-quantification",
    "excel",
    "openpyxl",
    "stoichiometry"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
]
dependencies = []

[project.optional-dependencies]
excel = [
    "openpyxl>=3.0.0",
]
gel = [
    "matplotlib>=3.5.0",
    "Pillow>=9.0.0",
    "openpyxl>=3.0.0",
]
eln = [
    "uvicorn>=0.20.0",
    "fastapi>=0.100.0",
    "sqlalchemy>=2.0.0",
    "PyYAML>=6.0",
]
all = [
    "openpyxl>=3.0.0",
    "matplotlib>=3.5.0",
    "Pillow>=9.0.0",
    "uvicorn>=0.20.0",
    "fastapi>=0.100.0",
    "sqlalchemy>=2.0.0",
    "PyYAML>=6.0",
]
dev = [
    "pytest>=7.0.0",
    "flake8>=5.0.0",
    "openpyxl>=3.0.0",
    "matplotlib>=3.5.0",
    "Pillow>=9.0.0",
    "uvicorn>=0.20.0",
    "fastapi>=0.100.0",
    "sqlalchemy>=2.0.0",
    "PyYAML>=6.0",
    "build",
    "twine",
    "wheel",
]

[project.urls]
Homepage = "https://github.com/kabe89/BioLabCalc"
Repository = "https://github.com/kabe89/BioLabCalc"
Documentation = "https://github.com/kabe89/BioLabCalc"
Issues = "https://github.com/kabe89/BioLabCalc/issues"
Changelog = "https://github.com/kabe89/BioLabCalc"

[project.scripts]
biolabcalc = "biolabcalc.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"*" = ["*.sql", "*.js", "*.css", "*.html", "py.typed"]
